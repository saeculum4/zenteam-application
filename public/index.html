<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6D8EAE" />
  <title>ZENTEAM — Медитация, Дневник и Гармония</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="apple-touch-icon" href="/assets/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&family=Roboto+Mono:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app-root">
    <!-- Rendered dynamically by js/app.js -->
  </div>

  <!-- Immersive Meditation Overlay -->
  <div id="meditation-overlay" class="meditation-overlay hidden" aria-hidden="true"></div>

  <!-- Alarm / Reminder Modal -->
  <div id="alarm-modal" class="modal-backdrop hidden" aria-hidden="true"></div>

  <!-- Generic Drawer / Modal (Articles, Add Spot, Account Quick Setup) -->
  <div id="app-modal" class="modal-backdrop hidden" aria-hidden="true"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
